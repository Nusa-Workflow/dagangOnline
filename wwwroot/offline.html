<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mode Offline - dagangOnline</title>
    <style>
        :root {
            --primary: #0d6efd;
            --background: #f8fafc;
            --text: #0f172a;
            --muted: #64748b;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background-color: var(--background);
            color: var(--text);
            margin: 0;
            padding: 2rem;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            box-sizing: border-box;
            text-align: center;
        }
        .offline-card {
            background: #ffffff;
            border: 1px solid #e2e8f0;
            border-radius: 16px;
            padding: 2.5rem 2rem;
            max-width: 480px;
            box-shadow: 0 10px 30px -5px rgba(15, 23, 42, 0.08);
        }
        .icon {
            width: 64px;
            height: 64px;
            color: #d97706;
            margin-bottom: 1.25rem;
        }
        h1 {
            font-size: 1.5rem;
            margin: 0 0 0.75rem 0;
        }
        p {
            color: var(--muted);
            font-size: 0.95rem;
            line-height: 1.5;
            margin-bottom: 1.5rem;
        }
        .btn-retry {
            background-color: var(--primary);
            color: #ffffff;
            border: none;
            padding: 0.65rem 1.5rem;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }
        .btn-retry:hover {
            background-color: #0b5ed7;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <svg class="icon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M18.364 5.636a9 9 0 010 12.728m0 0l-2.829-2.829m2.829 2.829L21 21M15.536 8.464a5 5 0 010 7.072m0 0l-2.829-2.829m-4.243 4.243a9 9 0 01-12.728 0m0 0l2.829-2.829m-2.829 2.829L3 21m2.828-15.364a9 9 0 0112.728 0M8.464 15.536a5 5 0 010-7.072m0 0l2.829 2.829" />
        </svg>
        <h1>Koneksi Terputus</h1>
        <p>Anda sedang berada dalam mode offline. Periksa koneksi internet Anda untuk kembali mengakses seluruh fitur layanan dan data terbaru platform dagangOnline.</p>
        <button class="btn-retry" onclick="window.location.reload()">Coba Muat Ulang</button>
    </div>
</body>
</html>
